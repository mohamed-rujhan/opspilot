[project]
name = "opspilot"
version = "0.1.0"
description = "An internal operations assistant: answers HR/IT policy questions, raises tickets and routes risky actions for human approval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rujhan I.M." }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
ui = ["streamlit>=1.40"]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
